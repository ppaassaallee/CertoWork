name: CertoWork
options:
  bundleIdPrefix: ai.certo.work
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_VERSION: "5.9"
targets:
  CertoWork:
    type: application
    platform: iOS
    sources:
      - path: CertoWork
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ai.certo.work
      INFOPLIST_KEY_CFBundleDisplayName: Certo Work
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      CODE_SIGN_ENTITLEMENTS: CertoWork/CertoWork.entitlements
      TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: CertoWorkWidget
        embed: true
      - sdk: WidgetKit.framework
  CertoWorkMac:
    type: application
    platform: macOS
    sources:
      - path: CertoWork
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ai.certo.work.mac
      INFOPLIST_KEY_CFBundleDisplayName: Certo Work
      CODE_SIGN_ENTITLEMENTS: CertoWork/CertoWork.entitlements
      COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: CertoWorkWidgetMac
        embed: true
      - sdk: WidgetKit.framework
  CertoWorkWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CertoWorkWidget
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ai.certo.work.widget
      INFOPLIST_FILE: CertoWorkWidget/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGN_ENTITLEMENTS: CertoWorkWidget/CertoWorkWidget.entitlements
      SKIP_INSTALL: YES
      TARGETED_DEVICE_FAMILY: "1,2"
  CertoWorkWidgetMac:
    type: app-extension
    platform: macOS
    sources:
      - path: CertoWorkWidget
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ai.certo.work.mac.widget
      INFOPLIST_FILE: CertoWorkWidget/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGN_ENTITLEMENTS: CertoWorkWidget/CertoWorkWidget.entitlements
      SKIP_INSTALL: YES
