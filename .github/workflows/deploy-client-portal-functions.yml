name: Deploy Client Portal Functions

# Deliberate production release: Cloudflare's workflow only ships the SPA/Worker.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - run: npm run build --prefix functions
      - name: Deploy request and portal functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is required to deploy portal functions."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/certo-firebase.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/certo-firebase.json"
          npx --yes firebase-tools@14.27.0 deploy \
            --only functions:daily-plan:portalLoginPrecheck,functions:daily-plan:portalEnsureClaims,functions:daily-plan:createPortalRequest,functions:daily-plan:replyPortalRequest,functions:daily-plan:onProjectWriteForPortal,functions:daily-plan:onTaskWriteForPortal,functions:daily-plan:onClientSettingsWrite,functions:daily-plan:onMessageCreated \
            --project gen-lang-client-0277783597 --non-interactive
